aid: changed
name: ChangEd
description: >-
  ChangEd (Changed) is a consumer financial-technology company whose mobile app helps
  people pay off debt faster by automatically rounding up everyday purchases to the
  nearest dollar and directing those micro-savings toward student loans, credit cards,
  mortgages, personal loans, and auto loans. Founded by brothers Dan Stelmach and Nick
  Sky, the app launched in 2017, appeared on Shark Tank and took investment from Mark
  Cuban, and is a Techstars portfolio company. It links to a user's bank account, tracks
  spending, automates extra debt payments, supports savings goals, and visualizes payoff
  progress for a $4/month subscription, with banking services provided by nbkc bank
  (Member FDIC). ChangEd is a consumer mobile product and does not publish a public API,
  developer portal, or SDK; this profile is maintained as a company record in the API
  Evangelist network.
